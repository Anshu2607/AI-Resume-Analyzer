name: CareerLens AI - CI

"on": [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      MONGOMS_DISABLE_POSTINSTALL: "1"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6380"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm run test

      - name: Build backend
        run: npm run build

  frontend:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    env:
      VITE_API_BASE_URL: /api/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker Image Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t careerlens-backend:ci ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=/api/v1 \
            -t careerlens-frontend:ci \
            ./frontend
