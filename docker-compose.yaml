version: "3.8"

services:
  postgres:
    image: postgres:17
    container_name: resume-postgres
    environment:
      POSTGRES_DB: resume_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postres@123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: resume-backend
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/resume_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postres@12

  frontend:
    build: ./frontend
    container_name: resume-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: